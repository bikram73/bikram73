name: 🐍 Snake + Food Contribution

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake + Food
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: snake
          food_count: "8"
          palette: github-dark
          output_path: dist/snake-food-contribution-graph.svg

      - name: Publish Snake + Food
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-snake-food
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
