name: 🧩 Tetris Contribution

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Tetris
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "7"
          palette: "github-dark"
          animation_duration: "8"
          output_path: dist/tetris-contribution-graph.svg

      - name: Publish Tetris
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-tetris
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
