name: 🎮 Generate All Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 📥 CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2


      # ============================================================
      # 📁 PREPARE
      # ============================================================

      - name: 📁 Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf dist generated

          mkdir -p dist
          mkdir -p generated/arcade
          mkdir -p generated/snake
          mkdir -p generated/tetris
          mkdir -p generated/space


      # ============================================================
      # 🕹️ PAC-MAN
      # ============================================================

      - name: 🕹️ Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman"

      - name: 📦 Save Pac-Man
        run: |
          cp -f dist/pacman-contribution-graph*.svg generated/arcade/ || true


      # ============================================================
      # 🧱 BREAKOUT
      # ============================================================

      - name: 🧱 Generate Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "breakout"

      - name: 📦 Save Breakout
        run: |
          cp -f dist/breakout-contribution-graph*.svg generated/arcade/ || true


      # ============================================================
      # 🚀 GALAGA
      # ============================================================

      - name: 🚀 Generate Galaga
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "galaga"

      - name: 📦 Save Galaga
        run: |
          cp -f dist/galaga-contribution-graph*.svg generated/arcade/ || true


      # ============================================================
      # 🫧 PUZZLE BOBBLE
      # ============================================================

      - name: 🫧 Generate Puzzle Bobble
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "puzzle-bobble"

      - name: 📦 Save Puzzle Bobble
        run: |
          cp -f dist/puzzle-bobble-contribution-graph*.svg generated/arcade/ || true


      # ============================================================
      # 💣 BOMBERMAN
      # ============================================================

      - name: 💣 Generate Bomberman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "bomberman"

      - name: 📦 Save Bomberman
        run: |
          cp -f dist/bomberman-contribution-graph*.svg generated/arcade/ || true


      # ============================================================
      # 💠 MINESWEEPER
      # ============================================================

      - name: 💠 Generate Minesweeper
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "minesweeper"

      - name: 📦 Save Minesweeper
        run: |
          cp -f dist/minesweeper-contribution-graph*.svg generated/arcade/ || true


      # ============================================================
      # 🐍 STANDARD SNAKE
      # ============================================================

      - name: 🐍 Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            generated/snake/snake-dark.svg?palette=github-dark


      # ============================================================
      # 🐍🌊 OCEAN SNAKE
      # ============================================================

      - name: 🐍🌊 Generate Ocean Snake
        uses: Platane/snk@v3
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            generated/snake/snake-ocean.svg?color_snake=00bfff&color_dots=ffffff,7dd3fc,38bdf8,0284c7,075985


      # ============================================================
      # 🐍🔥 FIRE SNAKE
      # ============================================================

      - name: 🐍🔥 Generate Fire Snake
        uses: Platane/snk@v3
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            generated/snake/snake-fire.svg?color_snake=ff4500&color_dots=ffffff,ffcc80,ff9800,f4511e,b71c1c


      # ============================================================
      # 🐍💜 PURPLE SNAKE
      # ============================================================

      - name: 🐍💜 Generate Purple Snake
        uses: Platane/snk@v3
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            generated/snake/snake-purple.svg?color_snake=a855f7&color_dots=ffffff,e9d5ff,c084fc,9333ea,581c87


      # ============================================================
      # 🐍⚡ NEON SNAKE
      # ============================================================

      - name: 🐍⚡ Generate Neon Snake
        uses: Platane/snk@v3
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            generated/snake/snake-neon.svg?color_snake=00ff88&color_dots=ffffff,67e8f9,22d3ee,06b6d4,0891b2


      # ============================================================
      # 🐍🍎 SNAKE + FOOD
      # ============================================================

      - name: 🐍🍎 Generate Snake + Food
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: "snake"
          food_count: "5"
          output_path: generated/snake/snake-food.svg


      # ============================================================
      # 🧩 TETRIS CLASSIC
      # ============================================================

      - name: 🧩 Generate Tetris Classic
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "5"
          animation_duration: "8"
          output_path: generated/tetris/tetris-classic.svg


      # ============================================================
      # 🧩 TETRIS FAST
      # ============================================================

      - name: 🧩 Generate Tetris Fast
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "8"
          animation_duration: "5"
          output_path: generated/tetris/tetris-fast.svg


      # ============================================================
      # 🧩 TETRIS SLOW
      # ============================================================

      - name: 🧩 Generate Tetris Slow
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "3"
          animation_duration: "12"
          output_path: generated/tetris/tetris-slow.svg


      # ============================================================
      # 🚀 SPACE SHOOTER — RANDOM
      # ============================================================

      - name: 🚀 Space Shooter Random
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: generated/space/space-shooter-random.gif
          strategy: random


      # ============================================================
      # 🚀 SPACE SHOOTER — ROW
      # ============================================================

      - name: 🚀 Space Shooter Row
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: generated/space/space-shooter-row.gif
          strategy: row


      # ============================================================
      # 📦 COLLECT EVERYTHING
      # ============================================================

      - name: 📦 Collect generated files
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          find generated -type f \
            \( -name "*.svg" -o -name "*.gif" -o -name "*.webp" \) \
            -exec cp {} dist/ \;

          echo ""
          echo "========================================"
          echo "🎮 CONTRIBUTION ARCADE FILES"
          echo "========================================"

          find dist -maxdepth 1 -type f -printf '%f\n' | sort

          echo ""
          echo "Total:"
          find dist -maxdepth 1 -type f | wc -l


      # ============================================================
      # 🔍 VERIFY
      # ============================================================

      - name: 🔍 Verify contribution games
        shell: bash
        run: |
          set -e

          echo "Checking generated files..."

          test -f dist/pacman-contribution-graph-dark.svg
          test -f dist/breakout-contribution-graph-dark.svg
          test -f dist/galaga-contribution-graph-dark.svg
          test -f dist/puzzle-bobble-contribution-graph-dark.svg
          test -f dist/bomberman-contribution-graph-dark.svg
          test -f dist/minesweeper-contribution-graph-dark.svg

          test -f dist/snake-dark.svg
          test -f dist/snake-ocean.svg
          test -f dist/snake-fire.svg
          test -f dist/snake-purple.svg
          test -f dist/snake-neon.svg
          test -f dist/snake-food.svg

          test -f dist/tetris-classic.svg
          test -f dist/tetris-fast.svg
          test -f dist/tetris-slow.svg

          test -f dist/space-shooter-random.gif
          test -f dist/space-shooter-row.gif

          echo ""
          echo "========================================"
          echo "✅ ALL CONTRIBUTION ANIMATIONS VERIFIED"
          echo "========================================"


      # ============================================================
      # 🚀 PUBLISH TO OUTPUT
      # ============================================================

      - name: 🚀 Publish to output branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "========================================"
          echo "🚀 PUBLISHING TO OUTPUT BRANCH"
          echo "========================================"

          rm -rf /tmp/output-branch

          git clone \
            --depth 1 \
            --branch output \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/output-branch

          cd /tmp/output-branch

          echo "Cleaning old generated files..."

          find . -maxdepth 1 -type f \
            \( -name "*.svg" -o -name "*.gif" -o -name "*.webp" \) \
            -delete

          echo "Copying new generated files..."

          cp "${GITHUB_WORKSPACE}"/dist/* .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "✅ No changes to publish."
            exit 0
          fi

          git commit -m "🎮 Update contribution arcade animations"

          git push origin output

          echo ""
          echo "========================================"
          echo "✅ OUTPUT BRANCH UPDATED"
          echo "========================================"
