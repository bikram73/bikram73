name: 🎮 Generate All Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-animations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 📥 CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2


      # ============================================================
      # 📁 PREPARE
      # ============================================================

      - name: 📁 Prepare directories
        shell: bash
        run: |
          set -e

          rm -rf dist generated

          mkdir -p dist
          mkdir -p generated/arcade
          mkdir -p generated/snake
          mkdir -p generated/tetris
          mkdir -p generated/space


      # ============================================================
      # 🐍 SNAKE COLLECTION
      # ============================================================

      # IMPORTANT:
      # Generate ALL snake variants in ONE Platane/snk action.
      #
      # We intentionally use only color_snake + palette.
      # This avoids the black/empty SVG problem caused by the
      # previous custom color_dots configuration.

      - name: 🐍 Generate All Snake Variants
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          outputs: |
            generated/snake/github-contribution-grid-snake.svg?palette=github-light
            generated/snake/github-contribution-grid-snake-dark.svg?palette=github-dark
            generated/snake/snake-ocean.svg?palette=github-dark&color_snake=00bfff
            generated/snake/snake-fire.svg?palette=github-dark&color_snake=ff4500
            generated/snake/snake-purple.svg?palette=github-dark&color_snake=a855f7
            generated/snake/snake-neon.svg?palette=github-dark&color_snake=00ff88


      # ============================================================
      # 🐍🍎 SNAKE + FOOD
      # ============================================================

      - name: 🐍🍎 Generate Snake + Food
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: "snake"
          food_count: "5"
          output_path: generated/snake/snake-food.svg


      # ============================================================
      # 🕹️ PAC-MAN / ARCADE COLLECTION
      # ============================================================

      - name: 🕹️ Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman"

      - name: 📦 Copy Pac-Man
        shell: bash
        run: |
          set -e

          find . -type f \
            \( -name "pacman-contribution-graph.svg" \
            -o -name "pacman-contribution-graph-dark.svg" \) \
            -not -path "./.git/*" \
            -exec cp {} generated/arcade/ \; 2>/dev/null || true


      # ============================================================
      # 🧱 BREAKOUT
      # ============================================================

      - name: 🧱 Generate Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "breakout"

      - name: 📦 Copy Breakout
        shell: bash
        run: |
          set -e

          find . -type f \
            \( -name "breakout-contribution-graph.svg" \
            -o -name "breakout-contribution-graph-dark.svg" \) \
            -not -path "./.git/*" \
            -exec cp {} generated/arcade/ \; 2>/dev/null || true


      # ============================================================
      # 🚀 GALAGA
      # ============================================================

      - name: 🚀 Generate Galaga
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "galaga"

      - name: 📦 Copy Galaga
        shell: bash
        run: |
          set -e

          find . -type f \
            \( -name "galaga-contribution-graph.svg" \
            -o -name "galaga-contribution-graph-dark.svg" \) \
            -not -path "./.git/*" \
            -exec cp {} generated/arcade/ \; 2>/dev/null || true


      # ============================================================
      # 🫧 PUZZLE BOBBLE
      # ============================================================

      - name: 🫧 Generate Puzzle Bobble
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "puzzle-bobble"

      - name: 📦 Copy Puzzle Bobble
        shell: bash
        run: |
          set -e

          find . -type f \
            \( -name "puzzle-bobble-contribution-graph.svg" \
            -o -name "puzzle-bobble-contribution-graph-dark.svg" \) \
            -not -path "./.git/*" \
            -exec cp {} generated/arcade/ \; 2>/dev/null || true


      # ============================================================
      # 💣 BOMBERMAN
      # ============================================================

      - name: 💣 Generate Bomberman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "bomberman"

      - name: 📦 Copy Bomberman
        shell: bash
        run: |
          set -e

          find . -type f \
            \( -name "bomberman-contribution-graph.svg" \
            -o -name "bomberman-contribution-graph-dark.svg" \) \
            -not -path "./.git/*" \
            -exec cp {} generated/arcade/ \; 2>/dev/null || true


      # ============================================================
      # 💠 MINESWEEPER
      # ============================================================

      - name: 💠 Generate Minesweeper
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "minesweeper"

      - name: 📦 Copy Minesweeper
        shell: bash
        run: |
          set -e

          find . -type f \
            \( -name "minesweeper-contribution-graph.svg" \
            -o -name "minesweeper-contribution-graph-dark.svg" \) \
            -not -path "./.git/*" \
            -exec cp {} generated/arcade/ \; 2>/dev/null || true


      # ============================================================
      # 🧩 TETRIS CLASSIC
      # ============================================================

      - name: 🧩 Generate Tetris Classic
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "5"
          palette: "auto"
          animation_duration: "8"
          output_path: generated/tetris/tetris-classic.svg


      # ============================================================
      # 🧩⚡ TETRIS FAST
      # ============================================================

      - name: 🧩⚡ Generate Tetris Fast
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "5"
          palette: "auto"
          animation_duration: "4"
          output_path: generated/tetris/tetris-fast.svg


      # ============================================================
      # 🧩🐢 TETRIS SLOW
      # ============================================================

      - name: 🧩🐢 Generate Tetris Slow
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tetromino_count: "5"
          palette: "auto"
          animation_duration: "12"
          output_path: generated/tetris/tetris-slow.svg


      # ============================================================
      # 👾 SPACE INVADERS
      # ============================================================

      - name: 👾 Generate Space Invaders
        uses: VARDHAMANPATEL23/git-invader@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_username: ${{ github.repository_owner }}
          color: multi
          mode: dark
          ship: rocket
          output_dir: generated/space


      # ============================================================
      # 📦 COLLECT EVERYTHING
      # ============================================================

      - name: 📦 Collect generated files
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          find generated -type f \
            \( -name "*.svg" -o -name "*.gif" -o -name "*.webp" \) \
            -print

          find generated -type f \
            \( -name "*.svg" -o -name "*.gif" -o -name "*.webp" \) \
            -exec cp {} dist/ \;

          echo ""
          echo "=============================="
          echo "GENERATED FILES"
          echo "=============================="

          ls -lah dist


      # ============================================================
      # 🔍 VERIFY REQUIRED FILES
      # ============================================================

      - name: 🔍 Verify generated files
        shell: bash
        run: |
          set -e

          required_files=(
            "github-contribution-grid-snake.svg"
            "github-contribution-grid-snake-dark.svg"
            "snake-ocean.svg"
            "snake-fire.svg"
            "snake-purple.svg"
            "snake-neon.svg"
            "snake-food.svg"

            "pacman-contribution-graph-dark.svg"
            "breakout-contribution-graph-dark.svg"
            "galaga-contribution-graph-dark.svg"
            "puzzle-bobble-contribution-graph-dark.svg"
            "bomberman-contribution-graph-dark.svg"
            "minesweeper-contribution-graph-dark.svg"

            "tetris-classic.svg"
            "tetris-fast.svg"
            "tetris-slow.svg"

            "git-invader-multi-dark.svg"
          )

          failed=0

          for file in "${required_files[@]}"; do
            if [ -f "dist/$file" ]; then
              echo "✅ $file"
            else
              echo "❌ MISSING: $file"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "❌ One or more required files are missing."
            exit 1
          fi

          echo ""
          echo "✅ All master contribution animations generated."


      # ============================================================
      # 🚀 PUBLISH WITHOUT DELETING OTHER OUTPUT FILES
      # ============================================================

      - name: 🚀 Publish contribution animations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Cloning output branch..."

          rm -rf /tmp/output-branch

          git clone \
            --depth 1 \
            --branch output \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/output-branch

          cd /tmp/output-branch

          echo "Removing only files managed by this workflow..."

          managed_files=(
            "github-contribution-grid-snake.svg"
            "github-contribution-grid-snake-dark.svg"

            "snake-ocean.svg"
            "snake-fire.svg"
            "snake-purple.svg"
            "snake-neon.svg"
            "snake-food.svg"

            "pacman-contribution-graph.svg"
            "pacman-contribution-graph-dark.svg"

            "breakout-contribution-graph.svg"
            "breakout-contribution-graph-dark.svg"

            "galaga-contribution-graph.svg"
            "galaga-contribution-graph-dark.svg"

            "puzzle-bobble-contribution-graph.svg"
            "puzzle-bobble-contribution-graph-dark.svg"

            "bomberman-contribution-graph.svg"
            "bomberman-contribution-graph-dark.svg"

            "minesweeper-contribution-graph.svg"
            "minesweeper-contribution-graph-dark.svg"

            "tetris-classic.svg"
            "tetris-fast.svg"
            "tetris-slow.svg"

            "git-invader-multi-dark.svg"
          )

          for file in "${managed_files[@]}"; do
            rm -f "$file"
          done

          echo "Copying new files..."

          cp "${GITHUB_WORKSPACE}"/dist/* .

          echo ""
          echo "=============================="
          echo "OUTPUT BRANCH FILES"
          echo "=============================="

          ls -lah

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "✅ No changes to publish."
            exit 0
          fi

          git commit -m "🎮 Update contribution animations"

          git push origin output

          echo ""
          echo "✅ Contribution animations published successfully."
