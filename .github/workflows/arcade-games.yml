name: 🎮 Arcade Contribution Games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 🕹️ Generate Pac-Man + Arcade Games
      - name: 🎮 Generate Arcade Games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pac-man,breakout,galaga,puzzle-bobble,bomberman,minesweeper"

      # 📤 Publish everything to output branch
      - name: 🚀 Publish Games
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
