name: 🎮 Arcade Contribution Games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🎮 Generate Pac-Man, Breakout, Galaga, Puzzle Bobble
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman,breakout,galaga,puzzle-bobble"
          hide_month_labels: "false"

      - name: 🚀 Publish Arcade Games
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
