name: 💣 Bomberman Contribution

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  bomberman:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 💣 Generate Bomberman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: bikram73
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "bomberman"

      - name: 🚀 Publish Bomberman
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
